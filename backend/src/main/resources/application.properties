# ---------------------------------------------------------------
# ShopNest - Spring Boot E-Commerce API
# ---------------------------------------------------------------
spring.application.name=shopnest-ecommerce
server.port=8080

# ---------- MySQL datasource ----------
# createDatabaseIfNotExist=true means you do NOT have to create the
# schema by hand; MySQL just needs to be running.
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:shopnest_db}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---------- JPA / Hibernate ----------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ---------- JWT ----------
# Base64-ish long secret. Change it for anything real.
app.jwt.secret=ZmY0YjZkNzc4YTIyNGQ5OGIxYzNlNWY3YTk4MjM0NTZkZWFkYmVlZmNhZmViYWJlMTIzNDU2Nzg5MA==
app.jwt.expiration-ms=86400000

# ---------- CORS ----------
app.cors.allowed-origins=http://localhost:5180,http://localhost:5173,http://localhost:5174,http://localhost:3000

# ---------- Seed data ----------
app.seed.enabled=true

# ---------- Logging ----------
logging.level.org.springframework.security=INFO
logging.level.com.shopnest=DEBUG
